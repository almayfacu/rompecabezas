<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rompecabezas para Mi Amor</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/almayfacu/imagenes-flipbook/refs/heads/main/alma.png">
  <style>
    :root {
      --pastel1: #ffd1dc;
      --pastel2: #c2f0fc;
      --pastel3: #d5f3e5;
      --text: #6b6b6b;
    }

    body {
      margin: 0;
      background: #fcefee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      color: #ff4d94;
      margin-bottom: 10px;
      text-shadow: 1px 1px white;
    }

    #puzzle {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      user-select: none;
      touch-action: none;
      width: min(90vw, 300px);
      height: min(90vw, 300px);
    }

    .tile {
      width: 100%;
      height: 100%;
      background-size: cover;
      border-radius: 10px;
      cursor: grab;
      transition: transform 0.2s;
      touch-action: none;
    }

    #finalMessage {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255,255,255,0.95);
      color: var(--text);
      font-size: 2em;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      color: #ff4d94;
      overflow-y: auto;
    }

    #finalImage {
      width: 300px;
      height: auto;
      border-radius: 20px;
      animation: heartbeat 1s infinite;
    }

    #sorpresaImage {
      display: none;
      max-width: 90%;
      max-height: 60vh;
      border-radius: 20px;
      margin-top: 20px;
    }

    #retryButton {
      margin-top: 20px;
      margin-bottom: 20px;
      font-size: 1rem;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background-color: var(--pastel3);
      cursor: pointer;
      display: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      color: #ffffff;
      z-index: 20;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      25% {
        transform: scale(1.1);
      }
      50% {
        transform: scale(1);
      }
      75% {
        transform: scale(1.1);
      }
    }

    @media (max-width: 600px) {
      #puzzle {
        width: min(80vw, 240px);
        height: min(80vw, 240px);
      }

      #finalImage {
        width: 80%;
      }

      #finalMessage {
        font-size: 1.5em;
        padding-bottom: 20px;
      }

      #sorpresaImage {
        max-height: 50vh;
      }

      #retryButton {
        font-size: 0.9rem;
        padding: 10px 20px;
        margin-top: 15px;
        margin-bottom: 20px;
        line-height: 1.2;
        min-width: 140px;
        background-color: #ff4d94;
      }
    }
  </style>
</head>
<body>
  <h1>Armá el rompecabezas para descubrir otra razón</h1>
  <div id="puzzle"></div>

  <div id="finalMessage">
    <p id="mensajeFinal">¡TE AMO!</p>
    <img id="finalImage" src="alma.jpeg" alt="Imagen completa" />
    <img id="sorpresaImage" src="ser voz.png" alt="Sorpresa final" />
    <button id="retryButton">Volver a intentarlo</button>
  </div>

  <audio id="winSound" src="te amo.mp3" preload="auto"></audio>

  <script>
    const puzzle = document.getElementById('puzzle');
    const finalMessage = document.getElementById('finalMessage');
    const winSound = document.getElementById('winSound');
    const finalImage = document.getElementById('finalImage');
    const sorpresaImage = document.getElementById('sorpresaImage');
    const retryButton = document.getElementById('retryButton');

    const positions = Array.from({ length: 9 }, (_, i) => i);
    let tiles = [];
    let isAudioUnlocked = false;

    function unlockAudio() {
      winSound.play().then(() => {
        isAudioUnlocked = true;
        winSound.pause();
        winSound.currentTime = 0;
      }).catch(err => {
        console.log('No se pudo desbloquear el audio:', err);
      });
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function createTiles() {
      shuffle(positions);
      puzzle.innerHTML = '';
      tiles = [];

      const puzzleSize = puzzle.clientWidth;
      const tileSize = puzzleSize / 3;

      positions.forEach((pos, index) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.draggable = true;
        tile.style.backgroundImage = "url('alma.jpeg')";
        tile.style.backgroundPosition = `-${(pos % 3) * tileSize}px -${Math.floor(pos / 3) * tileSize}px`;
        tile.style.backgroundSize = `${puzzleSize}px ${puzzleSize}px`;
        tile.dataset.index = pos;
        tile.dataset.current = index;
        tiles.push(tile);
        puzzle.appendChild(tile);
      });

      addDragEvents();
      addTouchEvents();
    }

    function addDragEvents() {
      let dragged;

      tiles.forEach(tile => {
        tile.addEventListener('dragstart', e => {
          if (!isAudioUnlocked) {
            unlockAudio();
          }
          dragged = tile;
          e.dataTransfer.setData('text/plain', null);
        });

        tile.addEventListener('dragover', e => {
          e.preventDefault();
        });

        tile.addEventListener('drop', e => {
          e.preventDefault();
          if (dragged !== e.target) {
            const from = tiles.indexOf(dragged);
            const to = tiles.indexOf(e.target);

            [tiles[from], tiles[to]] = [tiles[to], tiles[from]];

            puzzle.innerHTML = '';
            tiles.forEach(t => puzzle.appendChild(t));

            checkWin();
          }
        });
      });
    }

    function addTouchEvents() {
      let dragged = null;
      let startX, startY;

      tiles.forEach(tile => {
        tile.addEventListener('touchstart', e => {
          e.preventDefault();
          if (!isAudioUnlocked) {
            unlockAudio();
          }
          dragged = tile;
          const touch = e.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
          tile.style.transform = 'scale(1.05)';
        });

        tile.addEventListener('touchmove', e => {
          e.preventDefault();
          if (dragged) {
            const touch = e.touches[0];
            const puzzleRect = puzzle.getBoundingClientRect();
            const tileSize = puzzleRect.width / 3;

            const col = Math.floor((touch.clientX - puzzleRect.left) / tileSize);
            const row = Math.floor((touch.clientY - puzzleRect.top) / tileSize);
            const targetIndex = row * 3 + col;

            if (targetIndex >= 0 && targetIndex < tiles.length) {
              const dropTarget = tiles[targetIndex];
              tiles.forEach(t => t.style.outline = t === dropTarget && t !== dragged ? '2px solid #ff4d94' : 'none');
            }
          }
        });

        tile.addEventListener('touchend', e => {
          e.preventDefault();
          if (dragged) {
            dragged.style.transform = '';
            tiles.forEach(t => t.style.outline = 'none');

            const touch = e.changedTouches[0];
            const puzzleRect = puzzle.getBoundingClientRect();
            const tileSize = puzzleRect.width / 3;
            const col = Math.floor((touch.clientX - puzzleRect.left) / tileSize);
            const row = Math.floor((touch.clientY - puzzleRect.top) / tileSize);
            const targetIndex = row * 3 + col;

            if (targetIndex >= 0 && targetIndex < tiles.length) {
              const dropTarget = tiles[targetIndex];
              if (dropTarget && dropTarget !== dragged) {
                const from = tiles.indexOf(dragged);
                const to = tiles.indexOf(dropTarget);

                [tiles[from], tiles[to]] = [tiles[to], tiles[from]];

                puzzle.innerHTML = '';
                tiles.forEach(t => puzzle.appendChild(t));

                checkWin();
              }
            }
            dragged = null;
          }
        });

        tile.addEventListener('touchcancel', () => {
          if (dragged) {
            dragged.style.transform = '';
            tiles.forEach(t => t.style.outline = 'none');
            dragged = null;
          }
        });
      });
    }

    function checkWin() {
      const isCorrect = tiles.every((tile, i) => parseInt(tile.dataset.index) === i);
      if (isCorrect) {
        if (isAudioUnlocked) {
          winSound.play().catch(err => console.log('Error al reproducir audio:', err));
        } else {
          unlockAudio();
          winSound.play().catch(err => console.log('Error al reproducir audio:', err));
        }
        finalMessage.style.display = 'flex';
        finalImage.style.display = 'block';
        sorpresaImage.style.display = 'none';
        retryButton.style.display = 'none';
        confettiEffect();

        setTimeout(() => {
          finalImage.style.display = 'none';
          sorpresaImage.style.display = 'block';
          retryButton.style.display = 'block';
          retryButton.style.opacity = '0';
          requestAnimationFrame(() => {
            retryButton.style.opacity = '1';
          });
        }, 4000);
      }
    }

    function confettiEffect() {
      for (let i = 0; i < 150; i++) {
        const confetti = document.createElement('div');
        confetti.style.position = 'fixed';
        confetti.style.width = '10px';
        confetti.style.height = '10px';
        confetti.style.background = `hsl(${Math.random() * 360}, 70%, 80%)`;
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-20px';
        confetti.style.opacity = Math.random();
        confetti.style.borderRadius = '50%';
        confetti.style.zIndex = 20;
        confetti.style.transition = 'transform 3s linear';

        document.body.appendChild(confetti);

        requestAnimationFrame(() => {
          confetti.style.transform = `translateY(${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`;
        });

        setTimeout(() => confetti.remove(), 3000);
      }
    }

    retryButton.addEventListener('click', () => {
      finalMessage.style.display = 'none';
      sorpresaImage.style.display = 'none';
      retryButton.style.display = 'none';
      createTiles();
    });

    window.addEventListener('resize', createTiles);
    createTiles();
  </script>
</body>

</html>
